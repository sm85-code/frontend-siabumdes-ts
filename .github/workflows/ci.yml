name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-build:
    # Playwright 1.55 has no chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # Thin Playwright smoke (chromium only). API mocked — no backend.
      # Cached browsers keep free-tier CI affordable; retries=1 in config.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        run: yarn smoke:install --with-deps

      - name: Smoke (login + protected redirect)
        run: yarn smoke
        env:
          CI: true

  # Auto-deploy to Cloudflare Pages on push to main, only after checks pass.
  # Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
  # and CLOUDFLARE_ACCOUNT_ID. Skips (with a notice) while they are not set.
  deploy:
    needs: lint-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-production
      cancel-in-progress: false
    steps:
      - name: Check Cloudflare secrets
        id: chk
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Pages deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        if: steps.chk.outputs.ok == 'true'
        run: yarn install --frozen-lockfile

      - name: Build (production)
        if: steps.chk.outputs.ok == 'true'
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: |
          test -n "$VITE_BACKEND_URL" || { echo "::error::repo variable VITE_BACKEND_URL is not set"; exit 1; }
          yarn build

      - name: SPA fallback
        if: steps.chk.outputs.ok == 'true'
        run: printf '/* /index.html 200\n' > dist/_redirects

      - name: Deploy to Cloudflare Pages
        if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ak-siabumdes --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
