name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # Thin Playwright smoke (chromium only). API mocked — no backend.
      # Cached browsers keep free-tier CI affordable; retries=1 in config.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        run: yarn smoke:install --with-deps

      - name: Smoke (login + protected redirect)
        run: yarn smoke
        env:
          CI: true
